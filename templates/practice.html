<!DOCTYPE html>
<html>
<head>
<title>Dashboard</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>


<style>
    h2 {
        font-size: 1.5rem;
    }
    @media (min-width: 768px) {
        h2 {
            font-size: 2rem;
        }
    }

    .heading {
            margin-top: 20px;
            margin-bottom: 25px;
            font-weight: bold;
            color: blueviolet;
            text-align: center;
        }

        .para {
            margin-top: 20px;
            margin-bottom: 25px;
            font-weight: bold;
            color: orangered;
            text-align: center;
        }
</style>

</head>
<body>

<div class="container mt-3">
    <h3 class="heading">179,GOVERNMENT POLYTECHNIC ATHANI</h3>
        <p class="para">ADMISSION STATISTICS FOR 2026</p>
    <!-- Statistics Cards -->
<div class="row mb-3">

    <div class="col-6 col-md-3">
        <div class="card text-white bg-primary">
            <div class="card-body text-center">
                <h6>Computer</h6>
                <h4>{{ stats["Computer Science & Engineering"] }}</h4>
            </div>
        </div>
    </div>

    <div class="col-6 col-md-3">
        <div class="card text-white bg-success">
            <div class="card-body text-center">
                <h6>Electronics</h6>
                <h4>{{ stats["Electronics & Communication Engineering"] }}</h4>
            </div>
        </div>
    </div>

    <div class="col-6 col-md-3 mt-2 mt-md-0">
        <div class="card text-white bg-warning">
            <div class="card-body text-center">
                <h6>Civil</h6>
                <h4>{{ stats["Civil Engineering"] }}</h4>
            </div>
        </div>
    </div>

    <div class="col-6 col-md-3 mt-2 mt-md-0">
        <div class="card text-white bg-danger">
            <div class="card-body text-center">
                <h6>Mechanical</h6>
                <h4>{{ stats["Mechanical Engineering"] }}</h4>
            </div>
        </div>
    </div>

</div>

</body>
</html>
