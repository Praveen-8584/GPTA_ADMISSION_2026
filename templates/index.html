<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>College Admission</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #1e1e2f, #343a40);
        }

        .main-box {
            max-width: 500px;
            margin: 60px auto;
            padding: 25px;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
        }

        .top-image {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 10px;
        }

        .heading {
            margin-top: 20px;
            margin-bottom: 25px;
            font-weight: bold;
            color: #333;
        }

        .para {
            margin-top: 20px;
            margin-bottom: 25px;
            font-weight: bold;
            color: orangered;
        }

        .btn-custom {
            width: 100%;
            margin-bottom: 15px;
            padding: 12px;
            font-size: 16px;
            border-radius: 8px;
        }

        .closed-msg {
            color: green;
            font-weight: bold;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="main-box">

        <!-- Top Image -->
        <img src="/static/images/college.jpeg" alt="College Image" class="top-image">

        <!-- Heading -->
        <h3 class="heading">179,GOVERNMENT POLYTECHNIC ATHANI</h3>
        <p class="para">ADMISSION REGISTRATION SOFTWARE FOR 2026 (ROUND-2)</p>

        <!-- Buttons -->
        <div id="buttons">
            <a href="/login" id="button1" class="btn btn-primary btn-custom">Staff Login</a>
            <a href="/login2" class="btn btn-dark btn-custom">Admin Login</a>
            <a href="/login3" class="btn-custom">Check Admission Satistics</a>
        </div>

        <!-- Closed Message -->
        <div id="closedMsg" class="closed-msg" style="display:none;">
            Staff Login available only between 9:00 AM to 5:00 PM
        </div>

    </div>

    <!-- JavaScript for Time Control -->
    <script>
        function checkTime() {
            const now = new Date();
            const hours = now.getHours(); // 0–23 format

            const start = 9; // 10 AM
            const end = 17;   // 5 PM

            if (hours >= start && hours < end) {
                document.getElementById("button1").style.display = "block";
                document.getElementById("closedMsg").style.display = "none";
            } else {
                document.getElementById("button1").style.display = "none";
                document.getElementById("closedMsg").style.display = "block";
            }
        }

        checkTime();
    </script>

</body>
</html>
