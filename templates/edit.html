<!DOCTYPE html>
<html>
<head>
<title>Edit Student</title>

<!-- Mobile Responsive -->
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
    body {
        background-color: #f4f6f9;
    }

    .form-box {
        max-width: 500px;
        margin: 30px auto;
        padding: 20px;
        background: #fff;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    @media (max-width: 576px) {
        .form-box {
            margin: 15px;
            padding: 15px;
        }
    }

    .required::after {
    content: " *";
    color: orangered;
    font-weight: bold;

</style>

</head>
<body>

<div class="container">
    <div class="form-box">

        <div class="d-flex justify-content-between align-items-center mb-3">
            <h5 class="mb-0">Update Details</h5>
            <a href="/logout" class="btn btn-danger btn-sm">Logout</a>
        </div>

        <!-- Success Message -->
        {% if success %}
        <div id="successMsg" class="alert alert-success text-center">
            Record Submit Successfully
        </div>
        {% endif %}

        <form method="POST">

            <div class="mb-2"><label class="required">Name As Per SSLC</label>
                <input type="text" name="name" value="{{student.name}}" class="form-control" placeholder="SSLC Name" oninput="this.value = this.value.toUpperCase();" required>
            </div>

            <div class="mb-2"><label class="required">Name As Per Aadhar</label>
                <input type="text" name="names" value="{{student.names}}" class="form-control" placeholder="Aadhar Name" oninput="this.value = this.value.toUpperCase();" required>
            </div>

            <div class="mb-2"><label class="required">Aadhar Number</label>
                <input type="text" name="anumber" value="{{student.anumber}}" class="form-control" placeholder="Aadhar Number" required>
            </div>

            <div class="mb-2"><label class="required">Name of the Mother</label>
                <input type="text" name="mother" value="{{student.mother}}" class="form-control" placeholder="Name of the Mother" oninput="this.value = this.value.toUpperCase();" required>
            </div>

            <div class="mb-2"><label class="required">Name of the Father</label>
                <input type="text" name="father" value="{{student.father}}" class="form-control" placeholder="Name of the Father" oninput="this.value = this.value.toUpperCase();" required>
            </div>

            <div class="mb-2"><label class="required">Date of Birth</label>
                <input type="date" name="dob" value="{{student.dob}}" class="form-control" placeholder="Date of Birth" required>
            </div>

            <!-- Gender Dropdown -->
            <div class="mb-2"><label class="required">Gender</label>
                <select name="gender" class="form-select" required>
                    <option value="">Select</option>
                    <option value="Male" {% if student.gender=='Male' %}selected{% endif %}>Male</option>
                    <option value="Female" {% if student.gender=='Female' %}selected{% endif %}>Female</option>
                    <option value="Other" {% if student.gender=='Other' %}selected{% endif %}>Other</option>
                </select>
            </div>

            <div class="mb-2"><label class="required">Religion</label>
                <select name="religion" class="form-select" required>
                    <option value="">Select</option>
                    <option value="Hindu" {% if student.religion=='Hindu' %}selected{% endif %}>Hindu</option>
                    <option value="Muslim" {% if student.religion=='Muslim' %}selected{% endif %}>Muslim</option>
                    <option value="Christian" {% if student.religion=='Christian' %}selected{% endif %}>Christian</option>
                    <option value="Sikh" {% if student.religion=='Sikh' %}selected{% endif %}>Sikh</option>
                    <option value="Buddhist" {% if student.religion=='Buddhist' %}selected{% endif %}>Buddhist</option>
                    <option value="Jain" {% if student.religion=='Jain' %}selected{% endif %}>Jain</option>
                    <option value="Others" {% if student.religion=='Others' %}selected{% endif %}>Others</option>
                </select>
            </div>

            <div class="mb-2"><label class="required">Qualifying Examination</label>
                <select name="qe" class="form-select" required>
                    <option value="">Select</option>
                    <option value="SSLC" {% if student.qe=='SSLC' %}selected{% endif %}>SSLC</option>
                    <option value="CBSC" {% if student.qe=='CBSC' %}selected{% endif %}>CBSC</option>
                    <option value="ICSE" {% if student.qu=='ICSE' %}selected{% endif %}>ICSE</option>
                    <option value="Others" {% if student.qe=='Others' %}selected{% endif %}>Others</option>
                </select>
            </div>

            <div class="mb-2"><label class="required">Code of Native State</label>
                <input type="text" name="cons" value="{{student.cons}}" class="form-control" placeholder="Code of Native State" required>
            </div>

             <div class="mb-2"><label class="required">Code of Native District</label>
                <input type="text" name="cond" value="{{student.cond}}" class="form-control" placeholder="Code of Native District" required>
            </div>

            <div class="mb-2"><label class="required">Total No of Years Studied In Karnataka</label>
                <input type="text" name="ysik" value="{{student.ysik}}" class="form-control" placeholder="Total No of Years Studied In Karnataka" required>
            </div>

            <div class="mb-3"><label class="required">Have You Studied In Rural Areas From 1 to 10</label>
                <select name="sira" class="form-select" required>
                    <option value="">Select</option>
                    <option value="Yes" {% if student.sira=='Yes' %}selected{% endif %}>Yes</option>
                    <option value="No" {% if student.sira=='No' %}selected{% endif %}>No</option>
                </select>
            </div>

            <div class="mb-3"><label class="required">Have You Studied In Kanada Medium From 1 to 10</label>
                <select name="sikm" class="form-select" required>
                    <option value="">Select</option>
                    <option value="Yes" {% if student.sikm=='Yes' %}selected{% endif %}>Yes</option>
                    <option value="No" {% if student.sikm=='No' %}selected{% endif %}>No</option>
                </select>
            </div>

            <div class="mb-3"><label class="required">Do You Claming Exemption From 5 Years of Study Rule</label>
                <select name="ceys" class="form-select" required>
                    <option value="">Select</option>
                    <option value="Yes" {% if student.ceys=='Yes' %}selected{% endif %}>Yes</option>
                    <option value="No" {% if student.ceys=='No' %}selected{% endif %}>No</option>
                </select>
            </div>

            <div class="mb-3"><label class="required">Do You Claiming SNQ Quota Benefit</label>
                <select name="snq" class="form-select" required>
                    <option value="">Select</option>
                    <option value="Yes" {% if student.snq=='Yes' %}selected{% endif %}>Yes</option>
                    <option value="No" {% if student.snq=='No' %}selected{% endif %}>No</option>
                </select>
            </div>

            <div class="mb-3"><label class="required">Do You Claiming HydKar Quota Benefit</label>
                <select name="chk" class="form-select" required>
                    <option value="">Select</option>
                    <option value="Yes" {% if student.chk=='Yes' %}selected{% endif %}>Yes</option>
                    <option value="No" {% if student.chk=='No' %}selected{% endif %}>No</option>
                </select>
            </div>

            <div class="mb-3"><label class="required">Do You Claiming Special Category Benefit</label>
                <select name="csc" class="form-select" required>
                    <option value="">Select</option>
                    <option value="Yes" {% if student.csc=='Yes' %}selected{% endif %}>Yes</option>
                    <option value="No" {% if student.csc=='No' %}selected{% endif %}>No</option>
                </select>
            </div>

            <div class="mb-2"><label class="required">Reserved Category Code</label>
                <input type="text" name="rc" value="{{student.rc}}" class="form-control" placeholder="Reserved Category" oninput="this.value = this.value.toUpperCase();" required>
            </div>

            <div class="mb-2"><label class="required">Cast Name</label>
                <input type="text" name="caste" value="{{student.caste}}" class="form-control" placeholder="Name of the Cast" oninput="this.value = this.value.toUpperCase();" required>
            </div>

            <div class="mb-2"><label class="required">Annual Income</label>
                <input type="text" name="income" value="{{student.income}}" class="form-control" placeholder="Annual Income" required>
            </div>

            <div class="mb-2"><label class="required">Register Number</label>
                <input type="text" name="rnumber" value="{{student.rnumber}}" class="form-control" placeholder="Register Number" required>
            </div>

            <div class="mb-2"><label class="required">Year Of Passing</label>
                <input type="text" name="ypassing" value="{{student.ypassing}}" class="form-control" placeholder="Year Of Passing" required>
            </div>

            <div class="mb-2"><label class="required">Total Max Marks In all Subjects</label>
                <input type="text" name="mmias" value="{{student.mmias}}" class="form-control" placeholder="Total Max Marks In all Subjects" required>
            </div>

            <div class="mb-2"><label class="required">Total Marks Obtained In All Subjects</label>
                <input type="text" name="omias" value="{{student.omias}}" class="form-control" placeholder="Total  Marks Obtained In all Subjects" required>
            </div>

            <div class="mb-2"><label class="required">Max Marks In Science</label>
                <input type="text" name="mmis" value="{{student.mmis}}" class="form-control" placeholder="Max Marks In Science" required>
            </div>

             <div class="mb-2"><label class="required">Marks Obtained In Science</label>
                <input type="text" name="mois" value="{{student.mois}}" class="form-control" placeholder="Marks Obtained In Science" required>
            </div>

            <div class="mb-2"><label class="required">Max Marks In Maths</label>
                <input type="text" name="mmim" value="{{student.mmim}}" class="form-control" placeholder="Max Marks In Maths" required>
            </div>

            <div class="mb-2"><label class="required">Marks Obtained In Maths</label>
                <input type="text" name="moim" value="{{student.moim}}" class="form-control" placeholder="Marks Obtained In Maths" required>
            </div>

            <div class="mb-2"><label class="required">Max Marks In Science & Maths</label>
                <input type="text" name="mmism" value="{{student.mmism}}" class="form-control" placeholder="Max Marks In Science & Maths" required>
            </div>

            <div class="mb-2"><label class="required">Marks Obtained In Science & Maths</label>
                <input type="text" name="omism" value="{{student.omism}}" class="form-control" placeholder="Marks Obtained In Science & Maths" required>
            </div>

            <div class="mb-2"><label class="required">Total Percentage</label>
                <input type="text" name="percentage" value="{{student.percentage}}" class="form-control" placeholder="Percentage" required>
            </div>

            <div class="mb-2"><label>Student Mobile Number</label>
                <input type="tel" name="smobile" value="{{student.smobile}}" class="form-control" placeholder="Student Mobile Number">
            </div>

            <div class="mb-2"><label class="required">Parent Mobile Number</label>
                <input type="tel" name="pmobile" value="{{student.pmobile}}" class="form-control" placeholder="Parent Mobile Number" required>
            </div>

            <div class="mb-2"><label class="required">Address</label>
                <input type="text" name="address" value="{{student.address}}" class="form-control" placeholder="Address" oninput="this.value = this.value.toUpperCase();" required>
            </div>

            <div class="mb-2"><label>Email</label>
                <input type="email" name="email" value="{{student.email}}" class="form-control" placeholder="Email">
            </div>

            <!-- Course Dropdown -->
            <div class="mb-3"><label class="required">Course</label>
                <select class="required" name="course" class="form-select" required>
                    <option value="">Select Course</option>
                    <option value="Not Allotted" {% if student.course=='Not Allotted' %}selected{% endif %}>Not Allotted</option>
                    <option value="Civil Engineering" {% if student.course=='Civil Engineering' %}selected{% endif %}>Civil Engineering</option>
                    <option value="Computer Science & Engineering" {% if student.course=='Computer Science & Engineering' %}selected{% endif %}>Computer Science & Engineering</option>
                    <option value="Electronics & Communication Engineering" {% if student.course=='Electronics & Communication Engineering' %}selected{% endif %}>Electronics & Communication Engineering</option>
                    <option value="Mechanical Engineering" {% if student.course=='Mechanical Engineering' %}selected{% endif %}>Mechanical Engineering</option>
                </select>
            </div>

            <div class="mb-2"><label class="required">Date Time</label>
                <input type="datetime-local" name="dt" value="{{student.dt}}" class="form-control" placeholder="Date & Time" required>
            </div>

            <div class="mb-2"><label class="required">Staff Details</label>
                <input type="text" name="staff" value="{{student.staff}}" class="form-control" placeholder="Address" oninput="this.value = this.value.toUpperCase();" required>
            </div>

            <button type="submit" class="btn btn-success w-100">Update</button>

        </form>

    </div>
</div>

<!-- Auto Hide Script -->
<script>
    setTimeout(function() {
        var msg = document.getElementById("successMsg");
        if (msg) {
            msg.style.display = "none";
        }
    }, 3000);
</script>

</body>
</html>
